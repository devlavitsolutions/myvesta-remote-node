name: Deploy to Staging Server

on:
  push:
    branches:
      - staging  # Trigger when staging branch is updated

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to remote server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.SERVER_PATH }}

      - name: Restart web services and Vesta
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
              echo "Restarting OpenLiteSpeed..."
              sudo systemctl restart lsws || true

              echo "Restarting Nginx (if used)..."
              sudo systemctl restart nginx || true

              echo "Restarting Vesta services..."
              sudo /usr/local/vesta/bin/v-restart-web
              sudo /usr/local/vesta/bin/v-restart-proxy
              sudo /usr/local/vesta/bin/v-restart-dns

              echo "Deployment completed."
EOF
