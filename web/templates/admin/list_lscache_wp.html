<!-- DataTable and checkbox handling -->
<script>
$(document).ready(function () {
    $.noConflict();

    // Initialize DataTable with sorting disabled on first column
    $('#myTable').DataTable({
        columnDefs: [
            { orderable: false, targets: [0] }
        ],
        paging: true,
        searching: true,
        order: [[1, 'asc']],
    });

    // "Select All" checkbox logic
    $('#selectAll').on('change', function () {
        const isChecked = $(this).is(':checked');
        $('#myTable tbody input.row-check').each(function () {
            if ($(this).closest('tr').is(':visible')) {
                $(this).prop('checked', isChecked);
            }
        });
    });

    // Auto-update "Select All" when individual boxes change
    $('#myTable tbody').on('change', '.row-check', function () {
        const totalVisible = $('#myTable tbody input.row-check:visible').length;
        const checkedVisible = $('#myTable tbody input.row-check:visible:checked').length;
        $('#selectAll').prop('checked', totalVisible === checkedVisible);
    });
});
</script>
